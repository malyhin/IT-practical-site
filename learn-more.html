<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>База знань OSINT | 12 матеріалів</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #030305;
            --card-bg: rgba(255, 255, 255, 0.025);
            --card-hover: rgba(255, 255, 255, 0.06);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #fcfcfd;
            --text-muted: #9ba1a6;
            --brand-gradient: linear-gradient(135deg, #0048bd, #2f71da, #cc21c3, #641aa1);
            --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
            --sidebar-width: 370px;
            --peek-width: 56px;
            --grain-svg: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        .grain-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 50;
            opacity: 0.06;
            mix-blend-mode: overlay;
            background-image: var(--grain-svg);
            background-repeat: repeat;
            background-size: 160px 160px;
        }

        .bg-container {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(110px);
            opacity: 0.38;
        }
        .orb-1 { width: 40vw; height: 40vw; background: #0048bd; top: -10%; left: -10%; }
        .orb-2 { width: 35vw; height: 35vw; background: #cc21c3; bottom: -10%; right: -10%; }

        /* Шапка */
        header {
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 36px;
            font-size: 12px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            background: rgba(3, 3, 5, 0.86);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            z-index: 25;
            flex-shrink: 0;
        }
        .logo-container {
            display: flex;
            align-items: center;
            gap: 14px;
            font-weight: 700;
            font-size: 17px;
            letter-spacing: 0.24em;
            text-decoration: none;
            color: #fff;
        }
        .logo-icon {
            width: 20px;
            height: 20px;
            background: var(--brand-gradient);
            border-radius: 6px;
            box-shadow: 0 0 15px rgba(100, 26, 161, 0.6);
            transform: rotate(15deg);
            flex-shrink: 0;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .counter-badge {
            font-variant-numeric: tabular-nums;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 999px;
            color: var(--text-muted);
            font-size: 11px;
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 180ms var(--ease-out);
        }
        .back-link:hover { color: #fff; }

        /* Основний макет */
        .content-layout {
            position: relative;
            display: flex;
            flex-grow: 1;
            height: calc(100vh - 70px);
            overflow: hidden;
        }

        /* ЧАСТКОВО ПРИХОВАНЕ ЛІВЕ МЕНЮ (Peek Rail + GPU Slide) */
        .post-sidebar {
            position: fixed;
            top: 70px;
            left: 0;
            width: var(--sidebar-width);
            max-width: 92vw;
            height: calc(100vh - 70px);
            background: rgba(9, 9, 14, 0.94);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 16px 0 48px rgba(0, 0, 0, 0.55);
            z-index: 20;
            display: flex;
            transform: translateX(calc(-100% + var(--peek-width)));
            transition: transform 280ms var(--ease-out), border-color 200ms var(--ease-out);
            will-change: transform;
        }

        /* Відкривається при наведенні, фокусі всередині або закріпленні */
        .post-sidebar:hover,
        .post-sidebar:focus-within,
        .post-sidebar.pinned {
            transform: translateX(0);
            border-right-color: rgba(204, 33, 195, 0.35);
        }

        .sidebar-main-col {
            width: calc(100% - var(--peek-width));
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }

        .search-box {
            padding: 16px 18px;
            border-bottom: 1px solid var(--border-color);
        }

        .search-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            padding: 11px 15px;
            border-radius: 10px;
            color: #fff;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color 180ms var(--ease-out), background-color 180ms var(--ease-out);
        }
        .search-input:focus {
            border-color: rgba(204, 33, 195, 0.65);
            background: rgba(255, 255, 255, 0.07);
        }

        .posts-list {
            overflow-y: auto;
            padding: 14px 16px 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-grow: 1;
        }

        .post-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 14px 16px;
            border-radius: 12px;
            cursor: pointer;
            text-align: left;
            color: inherit;
            font-family: inherit;
            transition: background-color 180ms var(--ease-out), border-color 180ms var(--ease-out), transform 140ms var(--ease-out);
        }
        .post-item:hover {
            background: var(--card-hover);
            border-color: rgba(255, 255, 255, 0.2);
        }
        .post-item:active { transform: scale(0.985); }

        .post-item.active {
            background: rgba(100, 26, 161, 0.18);
            border-color: rgba(204, 33, 195, 0.55);
        }

        .post-meta-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-variant-numeric: tabular-nums;
        }

        .post-tag {
            background: rgba(255, 255, 255, 0.06);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 10px;
            color: #d1d5db;
            white-space: nowrap;
        }

        .post-item h4 {
            font-size: 15px;
            font-weight: 500;
            color: #fff;
            line-height: 1.38;
        }

        /* Видима смужка-напрямна праворуч у боковій панелі (56px) */
        .sidebar-peek-rail {
            width: var(--peek-width);
            height: 100%;
            border-left: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(6, 6, 10, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 14px 0;
            gap: 8px;
            flex-shrink: 0;
        }

        .pin-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            cursor: pointer;
            display: grid;
            place-items: center;
            font-size: 14px;
            margin-bottom: 6px;
            transition: color 180ms var(--ease-out), background-color 180ms var(--ease-out), border-color 180ms var(--ease-out), transform 140ms var(--ease-out);
        }
        .pin-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.09);
            border-color: rgba(255, 255, 255, 0.22);
        }
        .pin-btn:active { transform: scale(0.95); }
        .post-sidebar.pinned .pin-btn {
            background: rgba(204, 33, 195, 0.22);
            border-color: rgba(204, 33, 195, 0.6);
            color: #fff;
        }

        .rail-numbers {
            display: flex;
            flex-direction: column;
            gap: 5px;
            overflow-y: auto;
            width: 100%;
            align-items: center;
            padding: 4px 0;
        }
        .rail-numbers::-webkit-scrollbar { width: 0; }

        .rail-dot {
            width: 34px;
            height: 28px;
            border-radius: 8px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-muted);
            font-family: inherit;
            font-size: 11px;
            font-weight: 500;
            font-variant-numeric: tabular-nums;
            cursor: pointer;
            transition: background-color 160ms var(--ease-out), color 160ms var(--ease-out), border-color 160ms var(--ease-out), transform 140ms var(--ease-out);
        }
        .rail-dot:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
        }
        .rail-dot:active { transform: scale(0.94); }
        .rail-dot.active {
            background: var(--brand-gradient);
            color: #fff;
            font-weight: 600;
        }

        /* Права область читання (зручна ширина завдяки прихованому меню) */
        .post-content-area {
            flex-grow: 1;
            padding: 48px 48px 80px calc(var(--peek-width) + 48px);
            overflow-y: auto;
            background: rgba(3, 3, 5, 0.28);
            transition: padding-left 280ms var(--ease-out);
        }

        .content-layout.sidebar-pinned .post-content-area {
            padding-left: calc(var(--sidebar-width) + 48px);
        }

        .content-box {
            max-width: 72ch;
            margin: 0 auto;
            animation: contentEnter 240ms var(--ease-out);
        }

        .article-header { margin-bottom: 28px; }

        .article-category {
            display: inline-block;
            background: var(--brand-gradient);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            padding: 5px 13px;
            border-radius: 999px;
            margin-bottom: 16px;
        }

        .content-box h2 {
            font-size: clamp(28px, 3.4vw, 38px);
            font-weight: 600;
            letter-spacing: -0.02em;
            line-height: 1.18;
            margin-bottom: 14px;
            color: #fff;
        }

        .article-info-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            color: var(--text-muted);
            font-size: 13px;
            font-variant-numeric: tabular-nums;
            margin-bottom: 26px;
        }

        .article-image-container {
            position: relative;
            margin-bottom: 32px;
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.48);
            background: linear-gradient(135deg, rgba(0, 72, 189, 0.25), rgba(100, 26, 161, 0.25));
            min-height: 220px;
        }

        .content-box img {
            width: 100%;
            height: 340px;
            object-fit: cover;
            display: block;
        }

        .article-text {
            max-width: 65ch;
        }

        .article-text p {
            font-size: 17px;
            color: var(--text-muted);
            margin-bottom: 22px;
            line-height: 1.78;
            font-weight: 300;
        }

        .article-text p strong {
            color: var(--text-main);
            font-weight: 500;
        }

        .article-text h3 {
            font-size: 21px;
            letter-spacing: -0.01em;
            color: #fff;
            margin: 32px 0 14px;
            font-weight: 600;
        }

        .tools-box {
            background: rgba(255, 255, 255, 0.025);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-left: 3px solid #cc21c3;
            padding: 22px 24px;
            border-radius: 0 14px 14px 0;
            margin: 28px 0;
        }

        .tools-box h4 {
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .tools-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .tools-list li {
            font-size: 15px;
            color: var(--text-muted);
            line-height: 1.6;
            padding-left: 16px;
            position: relative;
        }
        .tools-list li::before {
            content: '•';
            position: absolute;
            left: 0;
            color: #cc21c3;
            font-weight: 700;
        }
        .tools-list li strong {
            color: #fff;
            font-weight: 500;
        }

        .article-nav-footer {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            margin-top: 40px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
            max-width: 65ch;
        }

        .nav-step-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 18px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
            transition: background-color 180ms var(--ease-out), border-color 180ms var(--ease-out), transform 140ms var(--ease-out);
        }
        .nav-step-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(204, 33, 195, 0.45);
        }
        .nav-step-btn:active:not(:disabled) { transform: scale(0.97); }
        .nav-step-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        @keyframes contentEnter {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }

        @media (max-width: 900px) {
            .content-layout.sidebar-pinned .post-content-area {
                padding-left: calc(var(--peek-width) + 24px);
            }
            .post-content-area {
                padding: 32px 24px 64px calc(var(--peek-width) + 24px);
            }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.24); }
    </style>
</head>
<body>

    <div class="grain-overlay" aria-hidden="true"></div>
    <div class="bg-container" aria-hidden="true">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <header>
        <a href="index.html" class="logo-container">
            <div class="logo-icon"></div>
            O S I N T — База знань
        </a>
        <div class="header-actions">
            <span class="counter-badge" id="topicCounter">01 / 12</span>
            <a href="index.html" class="back-link">← На головну</a>
        </div>
    </header>

    <div class="content-layout" id="contentLayout">
        <!-- Частково прихована ліва панель -->
        <aside class="post-sidebar" id="postSidebar" aria-label="Список навчальних матеріалів">
            <div class="sidebar-main-col">
                <div class="search-box">
                    <input type="text" id="searchInput" class="search-input" placeholder="Пошук серед 12 матеріалів..." oninput="filterPosts()">
                </div>
                <div class="posts-list" id="postsList"></div>
            </div>

            <!-- Видима смужка з номерами тем та кнопкою закріплення -->
            <div class="sidebar-peek-rail">
                <button type="button" class="pin-btn" id="pinBtn" title="Закріпити або згорнути меню" aria-label="Закріпити меню">⇄</button>
                <div class="rail-numbers" id="railNumbers"></div>
            </div>
        </aside>

        <!-- Права панель читання -->
        <main class="post-content-area" id="postScrollArea">
            <div class="content-box" id="postDisplay"></div>
        </main>
    </div>

    <script>
        const posts = [
            {
                id: 0,
                title: "Аналіз метаданих (EXIF) та цифрових слідів",
                category: "Технічний OSINT",
                readTime: "4 хв читання",
                date: "Жовтень 2026",
                image: "https://images.unsplash.com/photo-1526304640581-d334cdbbf45e?auto=format&fit=crop&w=1350&q=80",
                intro: "Кожне цифрове зображення зберігає масив прихованої технічної інформації, яка здатна розповісти більше, ніж сам кадр.",
                content: `
                    <p>Коли ви робите знімок на смартфон або камеру, файл записується у форматі JPEG чи RAW і автоматично доповнюється EXIF-тегами. Для розвідки на основі відкритих джерел це первинне джерело технічних доказів.</p>
                    <p>У метаданих часто містяться точні GPS-координати, модель пристрою, точний час зйомки за UTC, параметри оптики та унікальний серійний номер сенсора.</p>
                    <h3>Поширені нюанси передачі файлів</h3>
                    <p>Популярні месенджери та соцмережі (Telegram, WhatsApp, Instagram) під час звичайного надсилання стискають зображення та очищують EXIF-теги. Проте якщо файл передано як «Документ» або електронним листом, оригінальні метадані зазвичай зберігаються.</p>
                    <div class="tools-box">
                        <h4>Рекомендовані інструменти:</h4>
                        <ul class="tools-list">
                            <li><strong>ExifTool</strong> — консольна утиліта для глибокого читання та аналізу метаданих будь-яких файлів.</li>
                            <li><strong>Jeffrey’s Image Metadata Viewer</strong> — онлайн-сервіс для швидкої перевірки зображень у браузері.</li>
                            <li><strong>FotoForensics</strong> — аналіз рівня стиснення (ELA) для виявлення слідів редагування.</li>
                        </ul>
                    </div>
                `
            },
            {
                id: 1,
                title: "Мистецтво геолокації: Визначення точок за фото",
                category: "Георозвідка",
                readTime: "6 хв читання",
                date: "Жовтень 2026",
                image: "https://images.unsplash.com/photo-1524661135-423995f22d0b?auto=format&fit=crop&w=1350&q=80",
                intro: "Як знайти точне місце зйомки кадру посеред мегаполіса чи гірської місцевості, маючи лише візуальні орієнтири.",
                content: `
                    <p>Геолокація за відкритими джерелами поєднує дедукцію, картографію та аналіз деталей довкілля. Коли координати відсутні у файлі, аналітик працює з візуальними підказками.</p>
                    <p>Пошук починається з фіксації «якорів»: форми опор ЛЕП, силуетів гірських хребтів, дорожньої розмітки, типу архітектури або вивісок локального бізнесу.</p>
                    <h3>Етапи верифікації локації</h3>
                    <p><strong>1. Макро-орієнтири:</strong> визначення країни та регіону за кліматом, рослинністю, стандартами номерних знаків і мовою написів.<br>
                    <strong>2. Мікро-орієнтири:</strong> звірка точного ракурсу будівлі через супутникові знімки та вуличні панорами.</p>
                    <div class="tools-box">
                        <h4>Сервіси для георозвідки:</h4>
                        <ul class="tools-list">
                            <li><strong>Google Earth Pro</strong> — 3D-моделювання міст, історичні супутникові знімки та вимірювання відстаней.</li>
                            <li><strong>OpenStreetMap / Overpass Turbo</strong> — пошук об'єктів за специфічними комбінаціями ознак на мапі.</li>
                            <li><strong>PeakFinder</strong> — ідентифікація гірських вершин за лінією горизонту.</li>
                        </ul>
                    </div>
                `
            },
            {
                id: 2,
                title: "OSINT нікнеймів та пошук цифрового сліду",
                category: "Цифрова ідентичність",
                readTime: "5 хв читання",
                date: "Вересень 2026",
                image: "https://images.unsplash.com/photo-1563986768609-322da13575f3?auto=format&fit=crop&w=1350&q=80",

        let currentPostId = 0;
        const sidebarEl = document.getElementById('postSidebar');
        const layoutEl = document.getElementById('contentLayout');
        const pinBtn = document.getElementById('pinBtn');

        pinBtn.addEventListener('click', () => {
            const isPinned = sidebarEl.classList.toggle('pinned');
            layoutEl.classList.toggle('sidebar-pinned', isPinned);
        });

        function renderRail() {
            const rail = document.getElementById('railNumbers');
            rail.innerHTML = '';
            posts.forEach(post => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `rail-dot ${post.id === currentPostId ? 'active' : ''}`;
                btn.textContent = String(post.id + 1).padStart(2, '0');
                btn.title = post.title;
                btn.onclick = () => selectPost(post.id);
                rail.appendChild(btn);
            });
        }

        function renderPosts(itemsToRender) {
            const listContainer = document.getElementById('postsList');
            listContainer.innerHTML = '';

            if (itemsToRender.length === 0) {
                listContainer.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 24px; font-size: 14px;">Нічого не знайдено</p>';
                return;
            }

            itemsToRender.forEach(post => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `post-item ${post.id === currentPostId ? 'active' : ''}`;
                btn.onclick = () => selectPost(post.id);
                btn.innerHTML = `
                    <div class="post-meta-info">
                        <span>${String(post.id + 1).padStart(2, '0')} · ${post.date}</span>
                        <span class="post-tag">${post.category}</span>
                    </div>
                    <h4>${post.title}</h4>
                `;
                listContainer.appendChild(btn);
            });
        }

        function getFilteredPosts() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            if (!query) return posts;
            return posts.filter(p =>
                p.title.toLowerCase().includes(query) ||
                p.category.toLowerCase().includes(query) ||
                p.intro.toLowerCase().includes(query)
            );
        }

        function filterPosts() {
            renderPosts(getFilteredPosts());
        }

        function selectPost(id) {
            currentPostId = id;
            const post = posts.find(p => p.id === id) || posts[0];

            renderPosts(getFilteredPosts());
            renderRail();

            document.getElementById('topicCounter').textContent =
                `${String(post.id + 1).padStart(2, '0')} / ${String(posts.length).padStart(2, '0')}`;

            const display = document.getElementById('postDisplay');
            display.style.animation = 'none';
            display.offsetHeight;
            display.style.animation = '';

            display.innerHTML = `
                <div class="article-header">
                    <span class="article-category">${post.category}</span>
                    <h2>${post.title}</h2>
                    <div class="article-info-bar">
                        <span>Модуль ${String(post.id + 1).padStart(2, '0')} з ${posts.length}</span>
                        <span>·</span>
                        <span>${post.date}</span>
                        <span>·</span>
                        <span>${post.readTime}</span>
                    </div>
                </div>
                <div class="article-image-container">
                    <img src="${post.image}" alt="${post.title}" onerror="this.style.display='none'">
                </div>
                <div class="article-text">
                    <p><strong>${post.intro}</strong></p>
                    ${post.content}
                </div>
                <div class="article-nav-footer">
                    <button type="button" class="nav-step-btn" ${post.id === 0 ? 'disabled' : ''} onclick="selectPost(${post.id - 1})">
                        ← Попередня тема
                    </button>
                    <button type="button" class="nav-step-btn" ${post.id === posts.length - 1 ? 'disabled' : ''} onclick="selectPost(${post.id + 1})">
                        Наступна тема →
                    </button>
                </div>
            `;

            document.getElementById('postScrollArea').scrollTop = 0;
            history.replaceState(null, '', `#post-${post.id}`);
        }

        const hashMatch = window.location.hash.match(/^#post-(\d+)$/);
        const initialId = hashMatch ? Math.min(Math.max(parseInt(hashMatch[1], 10), 0), posts.length - 1) : 0;
        selectPost(initialId);
    </script>
</body>
</html>
